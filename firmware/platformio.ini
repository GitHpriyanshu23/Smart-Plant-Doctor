; Smart Plant Doctor ESP32 firmware (device onboarding + multi-pot ingest)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  blynkkk/Blynk

build_flags =
  -D API_BASE_URL=\"http://192.168.1.100:8000\"
